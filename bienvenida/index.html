<script>
    (function () {
      const themeBtn = document.getElementById('theme-toggle-btn');
      const themeIcon = document.getElementById('theme-icon');
      const rootHtml = document.documentElement;

      if (themeBtn && themeIcon) {
        themeBtn.addEventListener('click', function () {
          const isDark = rootHtml.classList.contains('dark');
          if (isDark) {
            rootHtml.classList.remove('dark');
            themeIcon.textContent = 'dark_mode';
          } else {
            rootHtml.classList.add('dark');
            themeIcon.textContent = 'light_mode';
          }
        });
      }

      // Micro tactile reaction on buttons
      const ctaBtn = document.getElementById('btn-create-account');
      if (ctaBtn) {
        ctaBtn.addEventListener('click', function() {
          this.classList.add('brightness-90');
          setTimeout(() => this.classList.remove('brightness-90'), 150);
        });
      }
    })();
  </script>
